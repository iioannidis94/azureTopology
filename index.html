<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure Architecture Builder v2</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azure-blue:#0078D4;--azure-light:#50E6FF;--azure-dark:#003A5C;
    --accent:#FFB900;--danger:#FF4444;--success:#00C851;
    --bg:#060D18;--bg2:#0A1628;--bg3:#0F1F3A;
    --border:rgba(0,120,212,0.3);--text:#E8F4FD;--muted:#7BA3C0;--card-bg:rgba(10,22,40,0.95);
  }
  body.theme-drawio{--bg:#F0F2F5;--bg2:#FFFFFF;--bg3:#F8F9FA;--border:#D1D5DB;--text:#111827;--muted:#6B7280;--card-bg:#FFFFFF;--azure-light:#0078D4;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;transition:background .3s,color .3s;}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,120,212,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,120,212,.04) 1px,transparent 1px);background-size:40px 40px;}
  body.theme-drawio::before{background-image:linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);}
  header{position:relative;z-index:10;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--bg2);box-shadow:0 2px 10px rgba(0,0,0,.1);}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--azure-blue),#00BCF2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;color:white;}
  .logo h1{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;}
  .logo span{color:var(--azure-blue);}
  .header-actions{display:flex;gap:7px;align-items:center;}
  .badge{font-size:8px;padding:3px 7px;border-radius:20px;border:1px solid var(--success);color:var(--success);text-transform:uppercase;}
  .app{position:relative;z-index:1;display:grid;grid-template-columns:310px 1fr 290px;height:calc(100vh - 53px);}
  .sidebar{border-right:1px solid var(--border);overflow-y:auto;background:var(--card-bg);padding:12px;display:flex;flex-direction:column;gap:0;transition:background .3s;}
  .sidebar.right{border-right:none;border-left:1px solid var(--border);display:flex;flex-direction:column;padding:12px;gap:8px;overflow-y:auto;}
  
  /* HIERARCHY TREE */
  .tree-section-title{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--azure-blue);padding:6px 0 6px 0;border-bottom:1px solid var(--border);margin-bottom:8px;font-weight:700;}
  
  /* SUBSCRIPTION BLOCK */
  .sub-block{margin-bottom:12px;}
  .sub-header{display:flex;align-items:center;gap:5px;padding:7px 8px;background:rgba(255,185,0,.07);border:1px solid rgba(255,185,0,.3);border-radius:6px;border-left:3px solid #FFB900;margin-bottom:6px;}
  body:not(.theme-drawio) .sub-header{background:rgba(255,185,0,.1);}
  .sub-icon{font-size:12px;flex-shrink:0;}
  .sub-name-input{flex:1;background:transparent;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;outline:none;min-width:0;}
  .sub-name-input:focus{background:rgba(0,120,212,.1);border-radius:3px;padding:0 3px;}
  .icon-btn{background:transparent;border:none;cursor:pointer;font-size:11px;padding:2px 4px;border-radius:3px;color:var(--muted);transition:.15s;flex-shrink:0;}
  .icon-btn:hover{background:rgba(0,120,212,.15);color:var(--azure-blue);}
  .icon-btn.danger:hover{background:rgba(255,68,68,.15);color:var(--danger);}
  .sub-body{padding-left:10px;border-left:2px solid rgba(255,185,0,.2);display:flex;flex-direction:column;gap:5px;}
  
  /* RG BLOCK */
  .rg-block{border-radius:5px;overflow:visible;}
  .rg-header{display:flex;align-items:center;gap:4px;padding:5px 7px;background:rgba(135,100,184,.07);border:1px solid rgba(135,100,184,.25);border-radius:5px;border-left:2px solid #8764B8;cursor:pointer;}
  body:not(.theme-drawio) .rg-header{background:rgba(135,100,184,.12);}
  .rg-header:hover{border-color:#8764B8;}
  .rg-name-input{flex:1;background:transparent;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;outline:none;min-width:0;}
  .rg-name-input:focus{background:rgba(135,100,184,.1);border-radius:3px;padding:0 3px;}
  .rg-loc-select{background:transparent;border:1px solid transparent;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:8px;outline:none;cursor:pointer;max-width:70px;}
  .rg-loc-select:focus,
  .rg-loc-select:hover{border-color:rgba(135,100,184,.4);background:var(--bg2);border-radius:3px;}
  .rg-body{padding-left:8px;border-left:2px solid rgba(135,100,184,.15);display:flex;flex-direction:column;gap:5px;margin-top:4px;}
  .rg-toggle-icon{font-size:9px;color:var(--muted);transition:transform .2s;flex-shrink:0;}
  .rg-block.collapsed .rg-body{display:none;}
  .rg-block.collapsed .rg-toggle-icon{transform:rotate(-90deg);}
  
  /* VNET CARD */
  .vnet-card{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:8px;}
  .vnet-card-header{display:flex;align-items:center;gap:5px;margin-bottom:7px;}
  .vnet-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .vnet-name-input{flex:1;background:transparent;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;outline:none;min-width:0;}
  .vnet-name-input:focus{background:rgba(0,120,212,.08);border-radius:3px;padding:0 3px;}
  .vnet-cidr-input{width:90px;background:transparent;border:1px solid transparent;color:var(--azure-blue);font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;outline:none;text-align:center;border-radius:3px;flex-shrink:0;}
  .vnet-cidr-input:focus{border-color:var(--azure-blue);background:rgba(0,120,212,.08);}
  .resource-chips{display:flex;flex-wrap:wrap;gap:4px;}
  .chip{font-size:8px;padding:2px 6px;border-radius:3px;background:rgba(0,120,212,.08);border:1px solid rgba(0,120,212,.3);color:var(--text);cursor:pointer;display:flex;align-items:center;gap:4px;transition:.15s;max-width:95px;overflow:hidden;}
  body:not(.theme-drawio) .chip{color:white;background:rgba(0,120,212,.18);}
  .chip:hover{background:var(--azure-blue);color:white!important;}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chip.hub-chip{background:rgba(255,140,0,.08);border-color:rgba(255,140,0,.4);}
  body:not(.theme-drawio) .chip.hub-chip{background:rgba(255,140,0,.18);}
  .chip.hub-chip:hover{background:#FF8C00;color:white!important;}
  
  /* BUTTONS */
  .add-btn{display:flex;align-items:center;gap:5px;background:transparent;border:1px dashed var(--muted);color:var(--muted);padding:4px 8px;font-size:8px;cursor:pointer;border-radius:4px;font-family:'JetBrains Mono';transition:.15s;width:100%;justify-content:center;}
  .add-btn:hover{border-color:var(--azure-blue);color:var(--azure-blue);border-style:solid;}
  .add-btn.sub-level{border-color:rgba(255,185,0,.4);color:#FFB900;margin-top:6px;}
  .add-btn.sub-level:hover{border-color:#FFB900;color:#FFB900;background:rgba(255,185,0,.05);}
  .add-btn.rg-level{border-color:rgba(135,100,184,.4);color:#8764B8;}
  .add-btn.rg-level:hover{border-color:#8764B8;color:#8764B8;background:rgba(135,100,184,.05);}
  .add-btn.vnet-level{margin-top:4px;}
  
  /* RES DROPDOWN WITH SEARCH */
  .add-res-container{position:relative;}
  .res-dropdown{display:none;position:absolute;top:100%;left:0;width:210px;background:var(--bg2);border:1px solid var(--azure-blue);border-radius:6px;z-index:300;max-height:240px;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.3);}
  .res-dropdown.show{display:block;}
  .res-dd-section{font-size:7px;letter-spacing:1px;color:var(--muted);padding:5px 7px 2px;text-transform:uppercase;border-top:1px solid var(--border);}
  .res-dd-section:first-of-type{border-top:none;}
  .res-option{padding:5px 7px;font-size:9px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--text);}
  .res-option:hover{background:var(--azure-blue);color:white;}
  
  /* INPUT FIELDS (editor) */
  .input-field{background:rgba(0,0,0,.05);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;padding:5px 7px;border-radius:4px;outline:none;width:100%;transition:.2s;}
  body:not(.theme-drawio) .input-field{background:rgba(0,0,0,.3);color:white;}
  .input-field:focus{border-color:var(--azure-light);background:rgba(0,120,212,.1);}
  select.input-field{cursor:pointer;}
  
  /* EDITOR */
  #editor-container{flex-grow:1;}
  .editor-panel{background:var(--bg3);border:1px solid var(--azure-blue);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:9px;}
  .editor-header{display:flex;align-items:center;gap:7px;font-family:'Syne';font-size:13px;font-weight:700;color:var(--azure-blue);margin-bottom:2px;}
  .editor-row{display:flex;flex-direction:column;gap:2px;}
  .editor-label{font-size:8px;color:var(--muted);text-transform:uppercase;font-weight:bold;letter-spacing:.5px;}
  
  /* CANVAS */
  .canvas-area{position:relative;overflow:hidden;background:transparent;}
  #diagram-canvas{width:100%;height:100%;cursor:grab;}
  #diagram-canvas:active{cursor:grabbing;}
  
  /* EXPORT AREA */
  .export-area{padding-top:10px;margin-top:auto;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px;}
  .export-btn{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;padding:9px;border-radius:6px;border:none;background:linear-gradient(135deg,var(--azure-blue),#00BCF2);color:white;cursor:pointer;width:100%;transition:all .2s;text-transform:uppercase;}
  .export-btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,120,212,.4);}
  .export-btn.secondary{background:transparent;border:1px solid var(--azure-blue);color:var(--azure-blue);}
  body:not(.theme-drawio) .export-btn.secondary{color:#50E6FF;border-color:#50E6FF;}
  .export-btn.secondary:hover{background:rgba(0,120,212,.1);}
  .export-btn.reset{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .export-btn.reset:hover{background:var(--danger);color:white;box-shadow:0 5px 16px rgba(255,68,68,.4);}
  .hdr-btn{background:transparent;border:1px solid var(--muted);color:var(--muted);padding:4px 9px;font-size:8px;cursor:pointer;border-radius:4px;font-family:'JetBrains Mono';transition:.2s;white-space:nowrap;}
  .hdr-btn:hover{border-color:var(--azure-blue);color:var(--azure-blue);background:rgba(0,120,212,.05);}
  
  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--bg2);border:1px solid var(--azure-blue);border-radius:12px;padding:22px;width:680px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column;gap:14px;}
  .modal h2{font-family:'Syne';color:var(--azure-blue);font-size:15px;}
  .modal pre{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:14px;font-size:9.5px;overflow:auto;flex-grow:1;max-height:380px;line-height:1.6;white-space:pre-wrap;color:var(--text);}
  .modal-actions{display:flex;gap:8px;}
  .modal-btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-family:'JetBrains Mono';font-size:9px;font-weight:700;}
  .modal-btn.primary{background:var(--azure-blue);color:white;}
  .modal-btn.secondary{background:transparent;border:1px solid var(--muted);color:var(--muted);}
  .modal-btn:hover{opacity:.85;}
  
  /* RENAME OVERLAY */
  #rename-overlay{display:none;position:fixed;z-index:500;}
  #rename-input{font-family:'JetBrains Mono',monospace;font-size:12px;padding:4px 8px;border:2px solid #0078D4;border-radius:4px;background:#fff;color:#111;outline:none;min-width:120px;}
  
  ::-webkit-scrollbar{width:3px;height:3px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--azure-blue);}
</style>
</head>
<body class="theme-drawio">

<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <h1>Azure <span>Architecture</span> Builder</h1>
  </div>
  <div class="header-actions">
    <button class="hdr-btn" onclick="toggleLayout()">📐 Layout</button>
    <button class="hdr-btn" onclick="toggleTheme()">🌗 Theme</button>
    <button class="hdr-btn" onclick="fitToScreen()">⊡ Fit</button>
    <div class="badge">● Live Mode</div>
  </div>
</header>

<div class="app">
  <div class="sidebar" id="sidebar-left"></div>
  <div class="canvas-area"><canvas id="diagram-canvas"></canvas></div>
  <div class="sidebar right" id="sidebar-right">
    <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--azure-blue);padding-bottom:6px;border-bottom:1px solid var(--border);font-weight:700;">// Properties Editor</div>
    <div id="editor-container">
      <div style="text-align:center;color:var(--muted);font-size:10px;margin-top:20px;line-height:1.9;">← Click a resource or VNet<br>to edit its properties<br><br>Double-click to rename<br>any element on canvas</div>
    </div>
    <div class="export-area">
      <button class="export-btn secondary" onclick="exportPng()">⬇ Export PNG</button>
      <button class="export-btn secondary" onclick="openPsModal()">⚡ Export PowerShell</button>
      <button class="export-btn secondary" onclick="openBicepModal()">📄 Export Bicep</button>
      <button class="export-btn reset" onclick="resetDiagram()">🔄 Reset Diagram</button>
    </div>
  </div>
</div>

<!-- PowerShell Modal -->
<div class="modal-overlay" id="ps-modal">
  <div class="modal">
    <h2>⚡ Azure PowerShell Deployment Script</h2>
    <pre id="ps-output"></pre>
    <div class="modal-actions">
      <button class="modal-btn primary" onclick="copyText('ps-output')">📋 Copy</button>
      <button class="modal-btn primary" onclick="downloadText('ps-output','azure-deploy.ps1')">⬇ Download .ps1</button>
      <button class="modal-btn secondary" onclick="closeModal('ps-modal')">✕ Close</button>
    </div>
  </div>
</div>

<!-- Bicep Modal -->
<div class="modal-overlay" id="bicep-modal">
  <div class="modal">
    <h2>📄 Bicep Template</h2>
    <pre id="bicep-output"></pre>
    <div class="modal-actions">
      <button class="modal-btn primary" onclick="copyText('bicep-output')">📋 Copy</button>
      <button class="modal-btn primary" onclick="downloadText('bicep-output','main.bicep')">⬇ Download .bicep</button>
      <button class="modal-btn secondary" onclick="closeModal('bicep-modal')">✕ Close</button>
    </div>
  </div>
</div>

<div id="rename-overlay">
  <input id="rename-input" type="text">
</div>

<script>
/* DUMMY ICONS OBJECT TO PREVENT CRASH */
const MS_ICONS = {}; 
const iconImgs={}; let iconsLoaded=0;

// ================================================================
// RESOURCE TYPES
// ================================================================
const RES_CATEGORIES={compute:'Compute',network:'Networking',data:'Data & Storage',security:'Security',integration:'Integration',ai:'AI & Analytics',management:'Management'};
const RES_TYPES={
  vm:{icon:'cloud_desktop',color:'#00BCF2',label:'Virtual Machine',cat:'compute',config:{size:'Standard_D2s_v3',os:'Ubuntu 22.04',zone:'1'}},
  vmss:{icon:'cloud_desktop',color:'#00A4EF',label:'VM Scale Set',cat:'compute',config:{size:'Standard_D2s_v3',minInstances:'2',maxInstances:'10'}},
  aks:{icon:'cloud_cube',color:'#0078D4',label:'AKS Cluster',cat:'compute',config:{nodes:'3',version:'1.29',tier:'Standard'}},
  fa:{icon:'deploy',color:'#8764B8',label:'Function App',cat:'compute',config:{plan:'Consumption',runtime:'.NET 8'}},
  aca:{icon:'cloud_cube',color:'#8764B8',label:'Container Apps',cat:'compute',config:{minReplicas:'0',maxReplicas:'10'}},
  fw:{icon:'shield_error',color:'#E81123',label:'Azure Firewall',cat:'network',config:{sku:'Premium',mode:'Alert & Deny',zones:'1,2,3'}},
  nva:{icon:'lock_shield',color:'#E81123',label:'FortiGate NVA',cat:'network',config:{mode:'Active/Passive',version:'7.6'}},
  agw:{icon:'globe',color:'#FF8C00',label:'App Gateway',cat:'network',config:{sku:'WAF_v2',capacity:'Autoscale',waf:'Enabled'}},
  lb:{icon:'arrow_sync',color:'#00BCF2',label:'Load Balancer',cat:'network',config:{sku:'Standard',type:'Internal'}},
  gw:{icon:'building_cloud',color:'#0078D4',label:'VPN Gateway',cat:'network',config:{sku:'VpnGw2AZ',routing:'BGP Enabled'}},
  ergw:{icon:'building_cloud',color:'#003A5C',label:'ExpressRoute GW',cat:'network',config:{sku:'ErGw2AZ',fastPath:'Enabled'}},
  bas:{icon:'lock_closed',color:'#0078D4',label:'Azure Bastion',cat:'network',config:{sku:'Standard',shareable:'Enabled'}},
  afd:{icon:'globe',color:'#FF8C00',label:'Azure Front Door',cat:'network',config:{sku:'Premium',waf:'Enabled'}},
  pe:{icon:'lock_closed',color:'#8764B8',label:'Private Endpoint',cat:'network',config:{targetService:'Storage',subresource:'blob'}},
  dns:{icon:'globe',color:'#00B294',label:'Private DNS Zone',cat:'network',config:{zone:'privatelink.blob.core.windows.net'}},
  nsg:{icon:'shield_error',color:'#E81123',label:'Network Sec Group',cat:'network',config:{rules:'5 custom rules'}},
  sql:{icon:'cloud_database',color:'#00B294',label:'Azure SQL',cat:'data',config:{tier:'General Purpose',vcores:'4',ha:'Zone Redundant'}},
  cosmos:{icon:'database',color:'#00B294',label:'Cosmos DB',cat:'data',config:{api:'NoSQL',consistency:'Session',zones:'Enabled'}},
  sa:{icon:'cloud_arrow_down',color:'#00B294',label:'Storage Account',cat:'data',config:{tier:'Standard',replication:'ZRS',accessTier:'Hot'}},
  redis:{icon:'database',color:'#E81123',label:'Azure Cache Redis',cat:'data',config:{sku:'Premium P1',zones:'Enabled'}},
  adls:{icon:'cloud_arrow_down',color:'#0078D4',label:'Data Lake Storage',cat:'data',config:{tier:'Standard',hns:'Enabled'}},
  kv:{icon:'key',color:'#FF8C00',label:'Key Vault',cat:'security',config:{sku:'Premium',rbac:'Enabled',purgeProtect:'Enabled'}},
  app:{icon:'globe',color:'#00BCF2',label:'App Service',cat:'integration',config:{sku:'Premium V3 P1v3',instances:'2',zone:'Enabled'}},
  apim:{icon:'globe',color:'#FF8C00',label:'API Management',cat:'integration',config:{tier:'Developer',capacity:'1'}},
  sb:{icon:'cloud',color:'#8764B8',label:'Service Bus',cat:'integration',config:{tier:'Premium',zones:'Enabled'}},
  evh:{icon:'cloud_arrow_up',color:'#8764B8',label:'Event Hub',cat:'integration',config:{tier:'Standard',partitions:'4'}},
  logic:{icon:'arrow_sync',color:'#8764B8',label:'Logic App',cat:'integration',config:{plan:'Standard',sku:'WS1'}},
  foundry:{icon:'bot',color:'#0078D4',label:'AI Foundry',cat:'ai',config:{kind:'AIServices',sku:'S0'}},
  openai:{icon:'bot',color:'#50E6FF',label:'Azure OpenAI',cat:'ai',config:{model:'gpt-4o',tier:'PayAsYouGo'}},
  docintel:{icon:'document_text',color:'#0078D4',label:'Document Intelligence',cat:'ai',config:{tier:'S0',endpoint:'Custom'}},
  search:{icon:'search',color:'#FF8C00',label:'AI Search',cat:'ai',config:{tier:'Standard',replicas:'1',partitions:'1'}},
  synapse:{icon:'data_bar_vertical',color:'#8764B8',label:'Synapse Analytics',cat:'ai',config:{sku:'Standard',dedicatedSql:'DW100c'}},
  monitor:{icon:'cloud_beaker',color:'#00B294',label:'Azure Monitor',cat:'management',config:{workspace:'Log Analytics',retentionDays:'90'}},
};

// ================================================================
// STATE
// ================================================================
const KEY='azureBuilderV_StableSearch'; // Changed key to force clean load
const SUB_COLORS=['#FFB900','#00BCF2','#00B294','#FF8C00','#8764B8'];
const RG_COLORS=['#8764B8','#0078D4','#00B294','#FF8C00','#E81123'];
const VNET_COLORS=['#0078D4','#00BCF2','#00B294','#FF8C00','#8764B8','#107C10'];

const defaultState={
  theme:'drawio',layout:'grid',
  subscriptions:[
    {id:'sub-1',name:'Azure Subscription'},
    {id:'sub-2',name:'Dev Subscription'}
  ],
  resourceGroups:[
    {id:'rg-conn', name:'rg-connectivity', location:'eastus',   subId:'sub-1'},
    {id:'rg-prod', name:'rg-production',   location:'eastus',   subId:'sub-1'},
    {id:'rg-dev',  name:'rg-development',  location:'westeurope',subId:'sub-2'}
  ],
  hub:{
    id:'hub',name:'hub-vnet',cidr:'10.0.0.0/16',color:'#0078D4',rgId:'rg-conn',
    resources:[
      {id:'rh1',type:'fw', name:'hub-firewall',config:{...RES_TYPES.fw.config}},
      {id:'rh2',type:'gw', name:'hub-vpngw',   config:{...RES_TYPES.gw.config}},
      {id:'rh3',type:'bas',name:'hub-bastion', config:{...RES_TYPES.bas.config}}
    ]
  },
  spokes:[
    {id:'sp1',name:'prod-vnet',cidr:'10.1.0.0/16',color:'#00BCF2',peering:true,rgId:'rg-prod',
     resources:[
       {id:'rs1',type:'vm',  name:'prod-vm-01',  config:{...RES_TYPES.vm.config}},
       {id:'rs2',type:'sql', name:'prod-sqldb',  config:{...RES_TYPES.sql.config}},
       {id:'rs3',type:'kv',  name:'prod-kv',     config:{...RES_TYPES.kv.config}},

try{

const uid=()=>'id-'+Math.random().toString(36).substr(2,9);
const esc=s=>String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

window.filterRes = function(vnetId, query) {
  const q = query.toLowerCase();
  const list = document.getElementById('res-list-' + vnetId);
  if(!list) return;
  let html = '';
  const cats={};
  Object.keys(RES_TYPES).forEach(k=>{
    const t=RES_TYPES[k];
    if(t.label.toLowerCase().includes(q) || (RES_CATEGORIES[t.cat]||t.cat).toLowerCase().includes(q)){
      if(!cats[t.cat])cats[t.cat]=[];
      cats[t.cat].push({key:k,...t});
    }
  });
  if(Object.keys(cats).length === 0) {
    html = '<div style="padding:8px;text-align:center;color:var(--muted);font-size:9px;">No resources found</div>';
  } else {
    Object.keys(cats).forEach(cat=>{
      html+=`<div class="res-dd-section">${RES_CATEGORIES[cat]||cat}</div>`;
      cats[cat].forEach(t=>{html+=`<div class="res-option" onclick="addResource('${vnetId}','${t.key}')"><span style="width:7px;height:7px;border-radius:50%;background:${t.color};flex-shrink:0;"></span>${t.label}</div>`;});
    });
  }
  list.innerHTML = html;
};

function getVnetsInRg(rgId){
  const result=[];
  if(state.hub.rgId===rgId) result.push(state.hub);
  state.spokes.forEach(s=>{if(s.rgId===rgId)result.push(s);});
  return result;
}

function renderEditor(){
  const el=document.getElementById('editor-container');
  if(!state.selectedId){
    el.innerHTML=`<div style="text-align:center;color:var(--muted);font-size:10px;margin-top:20px;line-height:1.9;">← Click a resource or VNet<br>to edit its properties<br><br>Double-click to rename<br>on the canvas</div>`;
    return;
  }
  let obj=null,parent=null,isVnet=false;
  if(state.hub.id===state.selectedId){obj=state.hub;isVnet=true;}
  else{
    state.spokes.forEach(s=>{
      if(s.id===state.selectedId){obj=s;isVnet=true;}
      const r=s.resources.find(r=>r.id===state.selectedId);
      if(r){obj=r;parent=s;}
    });
    const hr=state.hub.resources.find(r=>r.id===state.selectedId);
    if(hr){obj=hr;parent=state.hub;}
  }
  if(!obj){state.selectedId=null;return renderEditor();}

  const allRgOpts=state.resourceGroups.map(rg=>{
    const sub=state.subscriptions.find(s=>s.id===rg.subId);
    return `<option value="${rg.id}" ${(isVnet?obj.rgId:parent?.rgId)===rg.id?'selected':''}>${sub?sub.name+' / ':''} ${rg.name}</option>`;
  }).join('');

  let h=`<div class="editor-panel">`;
  if(isVnet){
    h+=`<div class="editor-header">🌐 ${esc(obj.name)}</div>
      <div class="editor-row"><span class="editor-label">VNet Name</span><input class="input-field" value="${esc(obj.name)}" onchange="updateVnet('${obj.id}','name',this.value)"></div>
      <div class="editor-row"><span class="editor-label">CIDR</span><input class="input-field" value="${esc(obj.cidr)}" onchange="updateVnet('${obj.id}','cidr',this.value)"></div>
      <div class="editor-row"><span class="editor-label">Resource Group</span><select class="input-field" onchange="updateVnet('${obj.id}','rgId',this.value)">${allRgOpts}</select></div>`;
    if(obj.id!=='hub'){
      const p=obj.peering!==false;
      h+=`<div class="editor-row"><span class="editor-label">Hub Peering</span>
        <button style="width:100%;padding:5px;border-radius:4px;cursor:pointer;font-family:JetBrains Mono;font-size:9px;border:1px solid ${p?'var(--azure-blue)':'var(--muted)'};background:${p?'rgba(0,120,212,.1)':'transparent'};color:${p?'var(--azure-blue)':'var(--muted)'};"
          onclick="togglePeering('${obj.id}')">${p?'🔗 Connected':'🔌 Disconnected'}</button></div>
        <button style="width:100%;padding:5px;border-radius:4px;cursor:pointer;font-size:9px;border:1px solid var(--danger);background:transparent;color:var(--danger);font-family:JetBrains Mono;margin-top:4px;" onclick="deleteSpoke('${obj.id}')">🗑 Delete Spoke</button>`;
    }
  }else{
    const rt=RES_TYPES[obj.type]||{color:'#888',label:'Resource'};
    h+=`<div class="editor-header"><span style="width:14px;height:14px;border-radius:3px;background:${rt.color}25;border:1px solid ${rt.color};display:inline-block;"></span>${rt.label}</div>
      <div class="editor-row"><span class="editor-label">Name</span><input class="input-field" value="${esc(obj.name)}" onchange="updateResource('${parent.id}','${obj.id}','name',this.value)"></div>`;
    Object.keys(obj.config).forEach(k=>{
      h+=`<div class="editor-row"><span class="editor-label">${k}</span><input class="input-field" value="${esc(obj.config[k])}" onchange="updateResConfig('${parent.id}','${obj.id}','${k}',this.value)"></div>`;
    });
    h+=`<button style="width:100%;padding:5px;border-radius:4px;cursor:pointer;font-size:9px;border:1px solid var(--danger);background:transparent;color:var(--danger);font-family:JetBrains Mono;margin-top:4px;" onclick="deleteResource('${parent.id}','${obj.id}')">🗑 Delete Resource</button>`;
  }
  h+=`</div>`;
  el.innerHTML=h;
}

function addSub(){
  const n=state.subscriptions.length;
  const id='sub-'+uid();
  state.subscriptions.push({id,name:`Subscription ${n+1}`});
  state.resourceGroups.push({id:'rg-'+uid(),name:'rg-default',location:'eastus',subId:id});
  fullUpdate();
}
function deleteSub(id){
  if(state.subscriptions.length<=1){alert('Need at least one subscription.');return;}
  if(!confirm('Delete subscription and all its resource groups? VNets in those RGs will move to the first available RG.')) return;
  const fallbackRg=state.resourceGroups.find(r=>r.subId!==id);
  if(!fallbackRg){alert('Cannot delete: no other resource group available.');return;}
  const subRgIds=state.resourceGroups.filter(r=>r.subId===id).map(r=>r.id);
  if(state.hub.rgId&&subRgIds.includes(state.hub.rgId)) state.hub.rgId=fallbackRg.id;
  state.spokes.forEach(s=>{if(subRgIds.includes(s.rgId))s.rgId=fallbackRg.id;});
  state.resourceGroups=state.resourceGroups.filter(r=>r.subId!==id);
  state.subscriptions=state.subscriptions.filter(s=>s.id!==id);
  fullUpdate();
}
function renameSub(id,val){const s=state.subscriptions.find(s=>s.id===id);if(s){s.name=val;saveState();draw();}}

function addRg(subId){
  const n=state.resourceGroups.filter(r=>r.subId===subId).length;
  state.resourceGroups.push({id:'rg-'+uid(),name:`rg-new-${n+1}`,location:'eastus',subId});
  fullUpdate();
}
function deleteRg(id){
  if(state.resourceGroups.length<=1){alert('Need at least one resource group.');return;}
  const fallback=state.resourceGroups.find(r=>r.id!==id);
  if(!fallback){alert('No fallback RG available.');return;}
  if(!confirm('Delete resource group? VNets will move to: '+fallback.name)) return;
  if(state.hub.rgId===id) state.hub.rgId=fallback.id;
  state.spokes.forEach(s=>{if(s.rgId===id)s.rgId=fallback.id;});
  state.resourceGroups=state.resourceGroups.filter(r=>r.id!==id);
  fullUpdate();
}
function renameRg(id,val){const rg=state.resourceGroups.find(r=>r.id===id);if(rg){rg.name=val;saveState();draw();}}
function setRgLocation(id,val){const rg=state.resourceGroups.find(r=>r.id===id);if(rg){rg.location=val;saveState();}}
function toggleRgCollapse(id){const rg=state.resourceGroups.find(r=>r.id===id);if(rg){rg.collapsed=!rg.collapsed;saveState();renderSidebar();}}

function addSpoke(rgId){
  const n=state.spokes.length;
  state.spokes.push({
    id:uid(),name:`spoke-${n+1}-vnet`,cidr:`10.${n+1}.0.0/16`,
    color:VNET_COLORS[n%VNET_COLORS.length],peering:true,
    rgId:rgId||state.resourceGroups[0]?.id,resources:[]
  });
  fullUpdate();
}
function deleteSpoke(id){state.spokes=state.spokes.filter(s=>s.id!==id);state.selectedId=null;fullUpdate();}
function updateVnet(id,key,val){
  if(state.hub.id===id)state.hub[key]=val;
  else{const s=state.spokes.find(s=>s.id===id);if(s)s[key]=val;}
  fullUpdate();
}
function togglePeering(id){const s=state.spokes.find(s=>s.id===id);if(s){s.peering=!s.peering;fullUpdate();}}

function toggleDropdown(id){
  document.querySelectorAll('.res-dropdown').forEach(d=>{
    if(d.id !== `dropdown-${id}`) d.classList.remove('show');
  });
  const dd=document.getElementById(`dropdown-${id}`);
  if(dd) {
    dd.classList.toggle('show');
    const inp = dd.querySelector('input');
    if(inp && dd.classList.contains('show')){
      inp.value = '';
      filterRes(id, '');
      inp.focus();
    }
  }
}
document.addEventListener('click',e=>{if(!e.target.closest('.add-res-container'))document.querySelectorAll('.res-dropdown').forEach(d=>d.classList.remove('show'));});

function addResource(vnetId,resType){
  const vnet=state.hub.id===vnetId?state.hub:state.spokes.find(s=>s.id===vnetId);
  const rT=RES_TYPES[resType];
  if(!rT||!vnet) return;
  const nr={id:uid(),type:resType,name:`${vnet.name.split('-')[0]}-${resType}`,config:{...rT.config}};
  vnet.resources.push(nr);
  document.querySelectorAll('.res-dropdown').forEach(d=>d.classList.remove('show'));
  preloadIcons(()=>selectNode(nr.id));
}
function deleteResource(vnetId,resId){
  const vnet=state.hub.id===vnetId?state.hub:state.spokes.find(s=>s.id===vnetId);
  if(vnet)vnet.resources=vnet.resources.filter(r=>r.id!==resId);
  state.selectedId=null;fullUpdate();
}
function updateResource(vnetId,resId,key,val){
  const vnet=state.hub.id===vnetId?state.hub:state.spokes.find(s=>s.id===vnetId);
  const r=vnet?.resources.find(r=>r.id===resId);if(r){r[key]=val;fullUpdate();}
}
function updateResConfig(vnetId,resId,k,val){
  const vnet=state.hub.id===vnetId?state.hub:state.spokes.find(s=>s.id===vnetId);
  const r=vnet?.resources.find(r=>r.id===resId);if(r){r.config[k]=val;saveState();renderEditor();}
}
function selectNode(id){state.selectedId=id;fullUpdate();}
function resetDiagram(){if(confirm('Reset to default?')){localStorage.removeItem(KEY);location.reload();}}

function preloadIcons(cb){
  if(cb) cb();
}

const canvas=document.getElementById('diagram-canvas');
const ctx=canvas.getContext('2d');
function safeRR(c,x,y,w,h,r){if(typeof c.roundRect==='function')c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function resize(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;draw();}
window.addEventListener('resize',resize);

function getRenderNodes(){
  const cx=canvas.width/2,cy=canvas.height/2,nodes=[];
  if(state.layout==='grid'){
    const RW=80,RH=56,RP=8,VPT=44,VPB=14,VPH=16,VGAP=50,LGAP=70;
    const vw=v=>Math.max(240,v.resources.length*(RW+RP)+VPH*2);
    const vh=()=>VPT+RH+VPB;
    const hW=vw(state.hub),hH=vh();
    const hubY=Math.max(cy-hH-LGAP/2-30,110);
    nodes.push({id:state.hub.id,isVnet:true,x:cx,y:hubY,width:hW,height:hH,label:state.hub.name,sub:state.hub.cidr,color:state.hub.color,peering:true,rgId:state.hub.rgId});
    state.hub.resources.forEach((res,i)=>{
      const tot=state.hub.resources.length,tw=tot*RW+(tot-1)*RP;
      nodes.push({id:res.id,isVnet:false,parentId:state.hub.id,x:cx-tw/2+RW/2+i*(RW+RP),y:hubY+VPT+RH/2-4,label:res.name,type:res.type,color:RES_TYPES[res.type]?.color||'#FFF',width:RW,height:RH});
    });
    const spW=state.spokes.map(s=>vw(s));
    const totW=spW.reduce((a,b)=>a+b,0)+VGAP*(state.spokes.length-1);
    const spY=hubY+hH+LGAP;
    let sx=cx-totW/2;
    state.spokes.forEach((sp,i)=>{
      const sW=spW[i],sH=vh(),svx=sx+sW/2;
      nodes.push({id:sp.id,isVnet:true,parentId:state.hub.id,x:svx,y:spY,width:sW,height:sH,label:sp.name,sub:sp.cidr,color:sp.color,peering:sp.peering!==false,rgId:sp.rgId});
      sp.resources.forEach((res,j)=>{
        const tot=sp.resources.length,tw=tot*RW+(tot-1)*RP;
        nodes.push({id:res.id,isVnet:false,parentId:sp.id,x:svx-tw/2+RW/2+j*(RW+RP),y:spY+VPT+RH/2-4,label:res.name,type:res.type,color:RES_TYPES[res.type]?.color||'#FFF',width:RW,height:RH});
      });
      sx+=sW+VGAP;
    });
  }else{
    const r=Math.min(canvas.width,canvas.height)*.33;
    nodes.push({id:state.hub.id,isVnet:true,x:cx,y:cy,label:state.hub.name,sub:state.hub.cidr,color:state.hub.color,radius:65,peering:true,rgId:state.hub.rgId});
    state.hub.resources.forEach((res,i)=>{
      const angle=(i/Math.max(state.hub.resources.length,1))*Math.PI*2-Math.PI/2;
      nodes.push({id:res.id,isVnet:false,parentId:state.hub.id,x:cx+Math.cos(angle)*130,y:cy+Math.sin(angle)*130,label:res.name,type:res.type,color:RES_TYPES[res.type]?.color||'#FFF',width:80,height:56});
    });
    state.spokes.forEach((sp,i)=>{
      const angle=state.spokes.length===1?Math.PI/2:(i/state.spokes.length)*Math.PI*2;
      const sx=cx+Math.cos(angle)*r,sy=cy+Math.sin(angle)*r;
      const perp={x:-Math.sin(angle),y:Math.cos(angle)};
      nodes.push({id:sp.id,isVnet:true,parentId:state.hub.id,x:sx,y:sy,label:sp.name,sub:sp.cidr,color:sp.color,radius:52,peering:sp.peering!==false,rgId:sp.rgId});
      sp.resources.forEach((res,j)=>{
        const t=sp.resources.length>1?(j*85-(sp.resources.length-1)*42.5):0;
        nodes.push({id:res.id,isVnet:false,parentId:sp.id,x:sx+Math.cos(angle)*115+perp.x*t,y:sy+Math.sin(angle)*115+perp.y*t,label:res.name,type:res.type,color:RES_TYPES[res.type]?.color||'#FFF',width:80,height:56});
      });
    });
  }
  return nodes;
}

function getSubBounds(subId,nodes,rgs){
  const subRgIds=rgs.filter(r=>r.subId===subId).map(r=>r.id);
  const related=nodes.filter(n=>n.isVnet&&subRgIds.includes(n.rgId));
  if(!related.length)return null;
  let mx=Infinity,my=Infinity,Mx=-Infinity,My=-Infinity;
  nodes.forEach(n=>{
    if(n.isVnet&&!subRgIds.includes(n.rgId)) return;
    const hw=n.width?n.width/2:n.radius||60,hh=n.height?n.height/2:n.radius||60;
    mx=Math.min(mx,n.x-hw);my=Math.min(my,n.y-hh);Mx=Math.max(Mx,n.x+hw);My=Math.max(My,n.y+hh);
    if(n.isVnet) nodes.filter(c=>c.parentId===n.id&&!c.isVnet).forEach(c=>{
      mx=Math.min(mx,c.x-c.width/2);my=Math.min(my,c.y-c.height/2);
      Mx=Math.max(Mx,c.x+c.width/2);My=Math.max(My,c.y+c.height/2);
    });
  });
  return{x:mx-28,y:my-46,w:Mx-mx+56,h:My-my+60};
}
function getRgBounds(rgId,nodes){
  const related=nodes.filter(n=>n.isVnet&&n.rgId===rgId);
  if(!related.length)return null;
  let mx=Infinity,my=Infinity,Mx=-Infinity,My=-Infinity;
  related.forEach(n=>{
    const hw=n.width?n.width/2:n.radius||60,hh=n.height?n.height/2:n.radius||60;
    mx=Math.min(mx,n.x-hw);my=Math.min(my,n.y-hh);Mx=Math.max(Mx,n.x+hw);My=Math.max(My,n.y+hh);
    nodes.filter(c=>c.parentId===n.id&&!c.isVnet).forEach(c=>{
      mx=Math.min(mx,c.x-c.width/2);my=Math.min(my,c.y-c.height/2);
      Mx=Math.max(Mx,c.x+c.width/2);My=Math.max(My,c.y+c.height/2);
    });
  });
  return{x:mx-14,y:my-26,w:Mx-mx+28,h:My-my+38};
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();ctx.translate(state.offset.x,state.offset.y);ctx.scale(state.scale,state.scale);
  const nodes=getRenderNodes();
  const map={};nodes.forEach(n=>map[n.id]=n);
  const dw=state.theme==='drawio';

  if(state.layout==='grid'){
    state.subscriptions.forEach((sub,si)=>{
      const b=getSubBounds(sub.id,nodes,state.resourceGroups);
      if(!b)return;
      const col=SUB_COLORS[si%SUB_COLORS.length];
      ctx.beginPath();safeRR(ctx,b.x,b.y,b.w,b.h,14);
      ctx.fillStyle=dw?`rgba(255,185,0,0.03)`:`rgba(255,185,0,0.05)`;ctx.fill();
      ctx.setLineDash([8,5]);ctx.strokeStyle=dw?`rgba(255,185,0,0.45)`:col+'70';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);
      ctx.font='bold 9px Syne';ctx.fillStyle=dw?'#B45309':col;
      ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText('☁ '+sub.name,b.x+12,b.y+17);
    });
    state.resourceGroups.forEach((rg,ri)=>{
      const b=getRgBounds(rg.id,nodes);
      if(!b)return;
      const col=RG_COLORS[ri%RG_COLORS.length];
      ctx.beginPath();safeRR(ctx,b.x,b.y,b.w,b.h,8);
      ctx.fillStyle=dw?'rgba(135,100,184,0.03)':'rgba(135,100,184,0.07)';ctx.fill();
      ctx.setLineDash([5,4]);ctx.strokeStyle=dw?'rgba(135,100,184,0.4)':'rgba(135,100,184,0.5)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
      ctx.font='8px JetBrains Mono';ctx.fillStyle=dw?'#8764B8':'#B08BE8';
      ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText('📁 '+rg.name,b.x+6,b.y+11);
    });
  }

  nodes.forEach(n=>{
    if(!n.parentId||!map[n.parentId])return;
    if(n.isVnet&&n.peering===false)return;
    const p=map[n.parentId];
    ctx.beginPath();
    if(state.layout==='grid'&&n.isVnet){
      const midY=p.y+p.height/2+28;
      ctx.moveTo(p.x,p.y+p.height/2);ctx.lineTo(p.x,midY);ctx.lineTo(n.x,midY);ctx.lineTo(n.x,n.y-n.height/2);
    }else if(state.layout==='grid'){return;}
    else{ctx.moveTo(n.x,n.y);ctx.lineTo(p.x,p.y);}
    if(dw){ctx.strokeStyle=n.isVnet?'#9CA3AF':'#D1D5DB';ctx.lineWidth=n.isVnet?2:1;if(!n.isVnet)ctx.setLineDash([4,4]);}
    else{
      if(n.isVnet){const g=ctx.createLinearGradient(p.x,p.y,n.x,n.y);g.addColorStop(0,'rgba(0,120,212,.6)');g.addColorStop(1,n.color+'80');ctx.strokeStyle=g;ctx.lineWidth=2;}
      else{ctx.strokeStyle=n.color+'60';ctx.lineWidth=1;ctx.setLineDash([3,6]);}
    }
    ctx.stroke();ctx.setLineDash([]);
    if(state.layout==='grid'&&n.isVnet&&n.peering!==false&&dw){
      const midY=p.y+p.height/2+28;
      ctx.font='7px JetBrains Mono';ctx.fillStyle='#9CA3AF';ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText('VNet Peering',(p.x+n.x)/2,midY-2);
    }
  });

  nodes.forEach(n=>drawNode(n));
  ctx.restore();
}

function drawNode(n){
  const isSel=state.selectedId===n.id,dw=state.theme==='drawio';
  ctx.save();
  if(isSel){ctx.shadowColor=dw?'rgba(0,120,212,.5)':n.color||'#0078D4';ctx.shadowBlur=12;}
  if(!n.isVnet){
    const rt=RES_TYPES[n.type]||{};
    ctx.beginPath();safeRR(ctx,n.x-n.width/2,n.y-n.height/2,n.width,n.height,6);
    if(dw){
      ctx.fillStyle='#FFFFFF';
      if(!isSel){ctx.shadowColor='rgba(0,0,0,.08)';ctx.shadowBlur=3;ctx.shadowOffsetY=2;}
      ctx.fill();ctx.strokeStyle=isSel?'#0078D4':'#E5E7EB';ctx.lineWidth=isSel?2:1;ctx.stroke();
      ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
      ctx.beginPath();safeRR(ctx,n.x-n.width/2,n.y-n.height/2,n.width,3,{tl:6,tr:6,bl:0,br:0});
      ctx.fillStyle=rt.color||'#0078D4';ctx.fill();
    }else{
      ctx.fillStyle=(rt.color||'#0078D4')+'22';ctx.fill();
      ctx.strokeStyle=isSel?(rt.color||'#0078D4'):(rt.color||'#0078D4')+'80';ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.shadowBlur=0;
    
    ctx.beginPath();ctx.arc(n.x,n.y-6,7,0,Math.PI*2);
    ctx.fillStyle=(rt.color||'#0078D4')+'40';ctx.fill();
    ctx.strokeStyle=rt.color||'#0078D4';ctx.lineWidth=1.5;ctx.stroke();
    
    ctx.font='bold 7.5px JetBrains Mono';ctx.fillStyle=dw?'#374151':'#FFF';
    ctx.textAlign='center';ctx.textBaseline='top';
    const lbl=n.label.length>13?n.label.slice(0,12)+'…':n.label;
    ctx.fillText(lbl,n.x,n.y+n.height/2-15);
  }else{
    if(state.layout==='grid'){
      ctx.beginPath();safeRR(ctx,n.x-n.width/2,n.y-n.height/2,n.width,n.height,10);
      if(dw){
        ctx.fillStyle=n.id==='hub'?'rgba(0,120,212,0.04)':'rgba(255,255,255,0.6)';ctx.fill();
        ctx.setLineDash([7,5]);ctx.strokeStyle=isSel?'#0078D4':n.color+'CC';ctx.lineWidth=isSel?2.5:1.5;ctx.stroke();ctx.setLineDash([]);
      }else{
        ctx.fillStyle=n.color+'12';ctx.fill();
        ctx.setLineDash([7,5]);ctx.strokeStyle=isSel?n.color:n.color+'70';ctx.lineWidth=isSel?2.5:2;ctx.stroke();ctx.setLineDash([]);
      }
      ctx.shadowBlur=0;
      ctx.font='bold 10px Syne';ctx.fillStyle=dw?'#111827':(n.id==='hub'?'#E8F4FD':n.color);
      ctx.textAlign='left';ctx.textBaseline='top';
      ctx.fillText(n.label,n.x-n.width/2+10,n.y-n.height/2+9);
      ctx.font='8px JetBrains Mono';ctx.fillStyle=dw?'#9CA3AF':'rgba(255,255,255,.6)';
      ctx.fillText(n.sub,n.x-n.width/2+10,n.y-n.height/2+22);
    }else{
      ctx.beginPath();ctx.arc(n.x,n.y,n.radius,0,Math.PI*2);
      if(dw){
        ctx.fillStyle='#FFFFFF';if(!isSel){ctx.shadowColor='rgba(0,0,0,.06)';ctx.shadowBlur=8;}
        ctx.fill();ctx.shadowBlur=0;
        ctx.setLineDash([6,5]);ctx.strokeStyle=isSel?'#0078D4':n.color+'CC';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
      }else{
        if(n.id==='hub'){const g=ctx.createRadialGradient(n.x-10,n.y-10,0,n.x,n.y,n.radius);g.addColorStop(0,'#1A8FE3');g.addColorStop(1,'#003A5C');ctx.fillStyle=g;}
        else ctx.fillStyle=n.color+'25';ctx.fill();
        ctx.setLineDash([6,5]);ctx.strokeStyle=isSel?n.color:n.color+'80';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
      }
      ctx.shadowBlur=0;
      ctx.font='bold 10px Syne';ctx.fillStyle=dw?'#111827':(n.id==='hub'?'#E8F4FD':n.color);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(n.label,n.x,n.y-8);
      ctx.font='8px JetBrains Mono';ctx.fillStyle=dw?'#9CA3AF':'rgba(255,255,255,.6)';
      ctx.fillText(n.sub,n.x,n.y+9);
    }
  }
  ctx.restore();
}

canvas.addEventListener('mousedown',e=>{
  const r=canvas.getBoundingClientRect();
  const px=(e.clientX-r.left-state.offset.x)/state.scale,py=(e.clientY-r.top-state.offset.y)/state.scale;
  const nodes=getRenderNodes();
  let hit=null;
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    if(!n.isVnet){if(Math.abs(px-n.x)<n.width/2&&Math.abs(py-n.y)<n.height/2){hit=n;break;}}
    else if(state.layout==='grid'){if(Math.abs(px-n.x)<n.width/2&&Math.abs(py-n.y)<n.height/2){hit=n;break;}}
    else{if(Math.sqrt((px-n.x)**2+(py-n.y)**2)<n.radius){hit=n;break;}}
  }
  if(hit)selectNode(hit.id);
  else{state.selectedId=null;fullUpdate();state.dragging=true;state.dragStart={x:e.clientX,y:e.clientY};state.offsetStart={...state.offset};canvas.style.cursor='grabbing';}
});
canvas.addEventListener('dblclick',e=>{
  const r=canvas.getBoundingClientRect();
  const px=(e.clientX-r.left-state.offset.x)/state.scale,py=(e.clientY-r.top-state.offset.y)/state.scale;
  const nodes=getRenderNodes();
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    let hit=!n.isVnet?(Math.abs(px-n.x)<n.width/2&&Math.abs(py-n.y)<n.height/2):
      state.layout==='grid'?(Math.abs(px-n.x)<n.width/2&&Math.abs(py-n.y)<n.height/2):
      (Math.sqrt((px-n.x)**2+(py-n.y)**2)<n.radius);
    if(hit){startInlineRename(n,e.clientX,e.clientY);break;}
  }
});
function startInlineRename(node,cx,cy){
  const ov=document.getElementById('rename-overlay'),inp=document.getElementById('rename-input');
  ov.style.display='block';ov.style.left=(cx-60)+'px';ov.style.top=(cy-16)+'px';
  inp.value=node.label;inp.focus();inp.select();
  const finish=()=>{
    const v=inp.value.trim();
    if(v){
      if(node.isVnet)updateVnet(node.id,'name',v);
      else if(node.parentId)updateResource(node.parentId,node.id,'name',v);
    }
    ov.style.display='none';inp.removeEventListener('blur',finish);inp.removeEventListener('keydown',kd);
  };
  const kd=e=>{if(e.key==='Enter')finish();if(e.key==='Escape'){ov.style.display='none';inp.removeEventListener('blur',finish);inp.removeEventListener('keydown',kd);}};
  inp.addEventListener('blur',finish);inp.addEventListener('keydown',kd);
}
canvas.addEventListener('mousemove',e=>{if(!state.dragging)return;state.offset.x=state.offsetStart.x+(e.clientX-state.dragStart.x);state.offset.y=state.offsetStart.y+(e.clientY-state.dragStart.y);draw();});
canvas.addEventListener('mouseup',()=>{if(state.dragging){state.dragging=false;saveState();}canvas.style.cursor='grab';});
canvas.addEventListener('mouseleave',()=>{if(state.dragging){state.dragging=false;saveState();}canvas.style.cursor='grab';});
canvas.addEventListener('wheel',e=>{e.preventDefault();state.scale=Math.max(.2,Math.min(3,state.scale*(e.deltaY<0?1.1:.9)));saveState();draw();},{passive:false});
function fitToScreen(){state.offset={x:0,y:0};state.scale=1;saveState();draw();}

function exportPng(){
  const ec=document.createElement('canvas');ec.width=canvas.width*2;ec.height=canvas.height*2;
  const c=ec.getContext('2d');c.scale(2,2);
  c.fillStyle=state.theme==='drawio'?'#F0F2F5':'#060D18';c.fillRect(0,0,canvas.width,canvas.height);
  c.drawImage(canvas,0,0,canvas.width,canvas.height);
  const a=document.createElement('a');a.download=`azure-arch-${Date.now()}.png`;a.href=ec.toDataURL();a.click();
}

function generatePowerShell(){
  const lines=[];
  lines.push(`# Azure PowerShell Deployment Script\n# Generated: ${new Date().toISOString()}\n`);
  state.subscriptions.forEach(sub=>{
    lines.push(`# ============ SUBSCRIPTION: ${sub.name} ============`);
    const subRgs=state.resourceGroups.filter(r=>r.subId===sub.id);
    subRgs.forEach(rg=>{
      lines.push(`New-AzResourceGroup -Name "${rg.name}" -Location "${rg.location}"`);
      getVnetsInRg(rg.id).forEach(vnet=>{
        lines.push(`$vnet = New-AzVirtualNetwork -Name "${vnet.name}" -ResourceGroupName "${rg.name}" -Location "${rg.location}" -AddressPrefix "${vnet.cidr}"`);
      });
    });
  });
  return lines.join('\n');
}

function generateBicep(){
  const lines=[`// Bicep Template — Azure Architecture Builder\ntargetScope = 'subscription'\n`];
  state.resourceGroups.forEach(rg=>{
    lines.push(`resource ${rg.id.replace(/-/g,'_')} 'Microsoft.Resources/resourceGroups@2021-04-01' = {\n  name: '${rg.name}'\n  location: '${rg.location||'eastus'}'\n}\n`);
  });
  return lines.join('\n');
}

function openPsModal(){document.getElementById('ps-output').textContent=generatePowerShell();document.getElementById('ps-modal').classList.add('show');}
function openBicepModal(){document.getElementById('bicep-output').textContent=generateBicep();document.getElementById('bicep-modal').classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
['ps-modal','bicep-modal'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{if(e.target===document.getElementById(id))closeModal(id);}));
function copyText(id){navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>alert('Copied!'));}
function downloadText(id,fn){const b=new Blob([document.getElementById(id).textContent],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;a.click();}

setTimeout(resize,50);fullUpdate();
